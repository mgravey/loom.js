<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loom ChatGPT sign-in</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 4rem auto;
        max-width: 38rem;
        padding: 0 2rem;
        line-height: 1.5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .brand img {
        display: block;
        width: 4.5rem;
        height: 4.5rem;
      }
      .brand h1 {
        margin: 0;
      }
      .success {
        color: #16803c;
      }
      .error {
        color: #c53030;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon128.png" alt="" width="72" height="72" />
        <h1>Loom ChatGPT sign-in</h1>
      </header>
      <p id="status" role="status" aria-live="polite">Completing sign-in…</p>
    </main>
    <script type="module" src="callback.js"></script>
  </body>
</html>
