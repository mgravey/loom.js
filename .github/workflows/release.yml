name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Public package directory to publish
        required: true
        default: companion-codex-experimental
        type: choice
        options:
          - agent-codex
          - auth-chatgpt-browser
          - auth-extension
          - coding
          - companion-codex-experimental
          - core
          - credential-broker-api
          - credential-provider-api
          - execution-browser
          - extension
          - model-anthropic-messages
          - model-codex-experimental
          - model-openai-responses
          - platform-browser
          - plugin-api
          - storage-indexeddb
          - tool-workspace
          - types
          - workspace-fsa

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.18.0

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify release and package tarballs
        run: pnpm release:check && pnpm release:pack

      - name: Publish selected package
        env:
          LOOM_RELEASE_DIRECTORY: ${{ inputs.package }}
        run: |
          LOOM_RELEASE_NAME=$(node -p "require('./packages/${LOOM_RELEASE_DIRECTORY}/package.json').name")
          LOOM_RELEASE_VERSION=$(node -p "require('./packages/${LOOM_RELEASE_DIRECTORY}/package.json').version")
          LOOM_RELEASE_TARBALL="./release-artifacts/mgravey-loom-${LOOM_RELEASE_DIRECTORY}-${LOOM_RELEASE_VERSION}.tgz"
          test "${LOOM_RELEASE_NAME}" = "@mgravey/loom-${LOOM_RELEASE_DIRECTORY}"
          test -f "${LOOM_RELEASE_TARBALL}"
          npm publish "${LOOM_RELEASE_TARBALL}"
