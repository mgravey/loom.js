<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loom Codex authentication experiment</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 48rem;
        padding: 2rem;
        line-height: 1.5;
      }
      .warning {
        border: 1px solid #b7791f;
        border-radius: 0.5rem;
        padding: 1rem;
      }
      .actions {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      button {
        justify-self: start;
        padding: 0.6rem 1rem;
      }
      #challenge[hidden] {
        display: none;
      }
      #user-code {
        font-family: ui-monospace, monospace;
        font-size: 1.4rem;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Codex authentication experiment</h1>
      <p class="warning">
        This integration is unsupported and may stop working without notice. It is not enabled by
        default. Refresh credentials remain inside this extension and are never exposed to Loom
        pages.
      </p>
      <div class="actions">
        <label>
          <input id="enabled" type="checkbox" />
          I understand and want to enable the experimental device-code flow.
        </label>
        <button id="authorize" type="button" disabled>Start device authorization</button>
      </div>
      <section id="challenge" hidden aria-live="polite">
        <h2>Complete sign-in</h2>
        <p>Open <a id="verification-url" target="_blank" rel="noreferrer"></a> and enter:</p>
        <p id="user-code"></p>
      </section>
      <p id="status" role="status" aria-live="polite">The experiment is disabled.</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
